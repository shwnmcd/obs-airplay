AirPlaySource="iPhone / iPad Screen Cast (AirPlay)"
ServerName="AirPlay Receiver Name"
ServerName.Description="Name shown in Control Center -> Screen Mirroring on your iPhone or iPad."
NetworkInterface="Network Interface (Wi-Fi / LAN)"
NetworkInterface.Description="Choose the network adapter on the same Wi-Fi/LAN as your iPhone. Auto automatically skips VPN and virtual adapters."
Resolution="Requested Resolution"
MaxFps="Max Frame Rate (FPS)"
EnableHevc="Enable H.265 (HEVC) Mirroring"
EnableHevc.Description="Allows newer iPhones/iPads to stream HEVC for higher image quality and lower bandwidth."
HardwareDecode="Hardware Video Decoding (D3D11VA)"
HardwareDecode.Description="Use GPU decoding when available, with automatic fallback to CPU decoding."
EnableAudio="Receive iPhone Audio"
EnableAudio.Description="Outputs mirrored iOS audio directly into the OBS Audio Mixer."
SyncDeviceVolume="Follow iPhone Volume Slider"
SyncDeviceVolume.Description="When enabled, volume changes made on the iPhone adjust the audio level in OBS."
ClearOnDisconnect="Clear Frame When Disconnected"
ClearOnDisconnect.Description="Hide the last mirrored frame automatically when Screen Mirroring stops."
PauseWhenHidden="Pause Receiver When Source Is Hidden"
PauseWhenHidden.Description="Automatically stops the AirPlay server and mDNS broadcasts when this source is hidden or on an inactive scene, eliminating background Wi-Fi/Bluetooth interference."
FixedPorts="Use Fixed Network Ports (Firewall Friendly)"
FixedPorts.Description="Binds TCP 7000/7001/7100 and UDP 6000/6001/7011 instead of random ephemeral ports."
PortOffset="Port Offset (for multiple sources)"
MacAddress="Device MAC Address (optional)"
MacAddress.Description="Leave blank to auto-generate a stable MAC address from the Receiver Name."
Password="AirPlay Static Password"
Password.Description="Custom password required on the iPhone when Static Password mode is selected."
SecurityGroup="Security & 2FA Protection"
SecurityMode="2FA / Authentication Mode"
SecurityMode.Description="Controls how iPhones authenticate before mirroring can begin."
SecurityMode.OneTimePin="One-Time 4-Digit 2FA PIN (Every Connection)"
SecurityMode.PairingPinTrusted="One-Time Pairing PIN + Remember Trusted iPhones (Ed25519)"
SecurityMode.StaticPassword="Static Password"
SecurityMode.None="No PIN (PC Approval / Allowlist Only)"
RequirePcApproval="Require PC Allow / Deny Popup for New Devices"
RequirePcApproval.Description="Shows a private Allow/Deny confirmation dialog on your PC with the connecting device's name and hardware ID (auto-denies after 25s)."
StrictTrustedOnly="Strict Allowlist (Silently Block Unknown Devices)"
StrictTrustedOnly.Description="Immediately blocks any iPhone not already in your Trusted Devices list without showing popups."
HidePopupsFromCapture="Hide 2FA Popups from OBS Capture & Screenshots"
HidePopupsFromCapture.Description="Uses Windows WDA_EXCLUDEFROMCAPTURE so viewers never see your 2FA code or device IDs even during Display Capture."
RevokeTrustedDevices="Revoke All Trusted Devices"
VerboseLogging="Verbose AirPlay Debug Logging"
RestartReceiver="Restart AirPlay Receiver"
StatusText="Connection Status"

